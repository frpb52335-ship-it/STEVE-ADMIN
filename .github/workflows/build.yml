name: Build STEVE ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.2"

      - name: Check project files
        run: |
          echo "Repository:"
          pwd
          echo
          echo "Root:"
          ls -la
          echo
          echo "STEVE ADMIN:"
          ls -la "STEVE ADMIN"
          echo
          echo "APP:"
          ls -la "STEVE ADMIN/app"

      - name: Check required files
        run: |
          test -f "STEVE ADMIN/settings.gradle.kts"
          test -f "STEVE ADMIN/build.gradle.kts"
          test -f "STEVE ADMIN/app/build.gradle.kts"
          echo "All Gradle files found."

      - name: Check Gradle
        run: gradle --version

      - name: Build debug APK
        working-directory: "STEVE ADMIN"
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: success()
        run: |
          find "STEVE ADMIN/app/build" -type f -name "*.apk" -print

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STEVE-ADMIN-debug
          path: "STEVE ADMIN/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
