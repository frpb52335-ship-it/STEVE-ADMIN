name: Build STEVE ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.2"

      - name: Check project structure
        run: |
          echo "Repository root:"
          pwd
          echo
          find . -maxdepth 4 -type f | sort

      - name: Check required files
        run: |
          test -f "STEVE ADMIN/settings.gradle.kts"
          test -f "STEVE ADMIN/build.gradle.kts"
          test -f "STEVE ADMIN/app/build.gradle.kts"
          echo "All required Gradle files found."

      - name: Build debug APK
        id: build
        working-directory: "STEVE ADMIN"
        continue-on-error: true
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            > build.log 2>&1

          echo "Gradle exit code: $?"
          
      - name: Display complete Gradle log
        working-directory: "STEVE ADMIN"
        run: |
          echo "========== COMPLETE GRADLE LOG =========="
          cat build.log
          echo "========== END GRADLE LOG =========="

      - name: Upload Gradle log
        uses: actions/upload-artifact@v4
        with:
          name: STEVE-ADMIN-build-log
          path: "STEVE ADMIN/build.log"
          if-no-files-found: error

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Gradle build failed."
          exit 1

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: STEVE-ADMIN-debug
          path: "STEVE ADMIN/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
