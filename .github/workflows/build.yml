name: Build STEVE ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.2"

      - name: Check project structure
        run: |
          echo "Repository root:"
          pwd
          echo
          echo "Root files:"
          ls -la
          echo
          echo "STEVE ADMIN:"
          ls -la "STEVE ADMIN"
          echo
          echo "APP:"
          ls -la "STEVE ADMIN/app"

      - name: Check required files
        run: |
          echo "Checking Gradle files..."

          test -f "STEVE ADMIN/settings.gradle.kts"
          echo "OK: settings.gradle.kts"

          test -f "STEVE ADMIN/build.gradle.kts"
          echo "OK: root build.gradle.kts"

          test -f "STEVE ADMIN/app/build.gradle.kts"
          echo "OK: app/build.gradle.kts"

          echo "All required Gradle files found."

      - name: Check Gradle version
        run: |
          gradle --version

      - name: Build debug APK
        working-directory: "STEVE ADMIN"
        run: |
          set +e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========== IMPORTANT BUILD ERRORS =========="

            grep -n -E \
              -B 5 -A 15 \
              "What went wrong|Execution failed|error:|e: |FAILURE:" \
              build.log || true

            echo ""
            echo "========== END BUILD ERRORS =========="

            exit "$BUILD_EXIT"
          fi

      - name: Find generated APK
        if: success()
        run: |
          echo "Searching for APK..."
          find "STEVE ADMIN/app/build" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STEVE-ADMIN-debug
          path: "STEVE ADMIN/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
