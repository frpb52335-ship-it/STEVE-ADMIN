name: Build STEVE ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Show project files
        working-directory: "STEVE ADMIN"
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Check Gradle
        working-directory: "STEVE ADMIN"
        run: |
          gradle --version

      - name: Build debug APK
        working-directory: "STEVE ADMIN"
        run: |
          gradle assembleDebug --no-daemon --stacktrace --info

      - name: Show generated APK
        if: success()
        working-directory: "STEVE ADMIN"
        run: |
          echo "Generated APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STEVE-ADMIN-debug
          path: "STEVE ADMIN/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
