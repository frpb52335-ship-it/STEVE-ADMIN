name: Build STEVE ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Check project structure
        run: |
          echo "Repository root:"
          pwd
          echo
          echo "Root files:"
          ls -la
          echo
          echo "STEVE ADMIN files:"
          ls -la "STEVE ADMIN"

      - name: Check required Gradle files
        run: |
          test -f "STEVE ADMIN/settings.gradle.kts" && echo "settings.gradle.kts OK"
          test -f "STEVE ADMIN/build.gradle.kts" && echo "root build.gradle.kts OK"
          test -f "STEVE ADMIN/app/build.gradle.kts" && echo "app/build.gradle.kts OK"

      - name: Check Gradle
        run: gradle --version

      - name: Build debug APK
        working-directory: "STEVE ADMIN"
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --info

      - name: Show generated APK
        if: success()
        run: |
          echo "Generated APK files:"
          find "STEVE ADMIN/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STEVE-ADMIN-debug
          path: "STEVE ADMIN/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
